<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zombie sounds</title>
</head>
<body>
<script>
// wasteland_zombies :: html/sounds.html
// Plays zombie sounds from the sound pack resource (its files, through NUI).
// The game says which file, how loud (distance) and from which side (pan).
(function () {
    'use strict';
    var ctx = null;
    var playing = 0;
    var MAX = 8;            // at once
    var cache = {};         // url -> AudioBuffer (or a promise)

    function audio() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function load(url) {
        if (!cache[url]) {
            cache[url] = fetch(url).then(function (r) {
                if (!r.ok) throw new Error(r.status + ' ' + url);
                return r.arrayBuffer();
            }).then(function (data) {
                return new Promise(function (ok, fail) { audio().decodeAudioData(data, ok, fail); });
            }).catch(function (e) { delete cache[url]; throw e; });
        }
        return cache[url];
    }

    function play(m) {
        if (playing >= MAX) return;
        var url = 'https://cfx-nui-' + m.pack + '/sounds/' + m.file;
        load(url).then(function (buffer) {
            var a = audio();
            var src = a.createBufferSource();
            src.buffer = buffer;
            src.playbackRate.value = m.rate || 1;
            var gain = a.createGain();
            gain.gain.value = Math.max(0, Math.min(1, m.volume || 0));
            var node = src.connect(gain);
            if (a.createStereoPanner) {
                var pan = a.createStereoPanner();
                pan.pan.value = Math.max(-1, Math.min(1, m.pan || 0));
                node.connect(pan); pan.connect(a.destination);
            } else {
                node.connect(a.destination);
            }
            playing++;
            src.onended = function () { playing--; };
            src.start();
        }).catch(function () { /* a missing file: stay quiet */ });
    }

    window.addEventListener('message', function (e) {
        var m = e.data;
        if (m && m.type === 'wlz:sound' && typeof m.file === 'string') play(m);
    });
})();
</script>
</body>
</html>
