# Wasteland Core - server.cfg (written by the txAdmin recipe)
#   https://github.com/gosalosey/wasteland-core
#   FiveM docs: https://docs.fivem.net/docs/server-manual/setting-up-a-server/

## You SHOULD edit the following:
sv_hostname "^1{{serverName}} ^7| Wasteland Core | Zombie Survival"
load_server_icon wasteland_core.png
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "Zombie survival: smart hordes, base building, hunting, crafting, groups, voice chat and trading."
sets tags "zombies, survival, pve, crafting, looting"
sets locale "en-US"

## You CAN edit the following:
# Build 3570: newer builds were missing parts of the map with this framework.
sv_enforceGameBuild 3570 #mp2025_01 - Money Fronts
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{serverEndpoints}}
set steam_webApiKey "none"
set resources_useSystemChat true

## Base resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
ensure hardcap

## Wasteland Core
# Database connection for oxmysql. This line contains a password: do not share this file.
set mysql_connection_string "{{dbConnectionString}}"
ensure oxmysql
## Voice chat (pma-voice): players near you hear you. F11 changes how far
## (whisper / normal / shout). Caps Lock talks on your group's radio (/group).
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "F11"
setr voice_defaultRadio "CAPITAL"
setr voice_enableRadioAnim 1
ensure pma-voice
ensure wasteland_loadscreen
ensure wasteland_config
ensure wasteland_core
ensure wasteland_database
ensure wasteland_players
ensure wasteland_ui
ensure wasteland_target
ensure wasteland_appearance
ensure wasteland_images
ensure wasteland_inventory
ensure wasteland_survival
ensure wasteland_world
ensure wasteland_admin
ensure wasteland_weapons
ensure wasteland_zombiemodels
ensure wasteland_zombies
ensure wasteland_loot
ensure wasteland_camps
ensure wasteland_crafting
ensure wasteland_quests
ensure wasteland_vehicles
ensure wasteland_emotes
ensure wasteland_tailor
ensure wasteland_supplydrops
ensure wasteland_events
ensure wasteland_groups
ensure wasteland_trade
ensure wasteland_hunting
ensure wasteland_skills
ensure wasteland_guide
# Base building needs the building props pack (not included: a licensed
# asset pack). Install it, then uncomment:
# ensure sinor-buildingProps-v2
ensure wasteland_basebuilding
ensure wasteland_template      # SDK example module (small; safe to remove together with "template = true" in modules.lua)

## Admins: the admin panel (F10) and the admin commands use this permission.
add_ace group.admin wasteland.admin allow
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but don't allow quit
{{addPrincipalsMaster}}
