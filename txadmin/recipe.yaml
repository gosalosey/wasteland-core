$engine: 3
$onesync: on
name: Wasteland Core
version: 1.0.3
author: gosalosey
description: |
  Zombie survival framework for FiveM: zombies, looting, crafting, survival,
  vehicles to repair, camps and traders, jobs, world events. No QBCore/ESX.
  Needs MySQL or MariaDB. Game build 3570.

tasks:
  # 1. FiveM's base resources (mapmanager, spawnmanager, ...)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources
    timeoutSeconds: 600

  # The old chat resource is replaced by FiveM's built-in chat.
  - action: remove_path
    path: ./resources/[gameplay]/chat

  # 2. oxmysql (the database driver), latest release
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
    path: ./tmp/oxmysql.zip
    timeoutSeconds: 600
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./tmp/oxmysql
  - action: move_path
    src: ./tmp/oxmysql/oxmysql
    dest: ./resources/[standalone]/oxmysql

  # 2b. pma-voice (voice chat; MIT licence, github.com/AvarianKnight/pma-voice)
  - action: download_file
    url: https://codeload.github.com/AvarianKnight/pma-voice/zip/refs/tags/v6.6.2
    path: ./tmp/pma-voice.zip
    timeoutSeconds: 600
  - action: unzip
    src: ./tmp/pma-voice.zip
    dest: ./tmp/pma-voice
  - action: move_path
    src: ./tmp/pma-voice/pma-voice-6.6.2
    dest: ./resources/[standalone]/pma-voice

  # 3. Wasteland Core: the main branch as one zip file (about 22 MB). A
  #    plain file download: faster and more reliable for a repository this
  #    size than download_github (which goes through the GitHub API).
  - action: download_file
    url: https://codeload.github.com/gosalosey/wasteland-core/zip/refs/heads/main
    path: ./tmp/wasteland.zip
    timeoutSeconds: 1200
  - action: unzip
    src: ./tmp/wasteland.zip
    dest: ./tmp/wasteland
    timeoutSeconds: 1200
  - action: move_path
    src: ./tmp/wasteland/wasteland-core-main/resources/[wasteland]
    dest: ./resources/[wasteland]
  - action: move_path
    src: ./tmp/wasteland/wasteland-core-main/txadmin/server.cfg
    dest: ./server.cfg
  - action: move_path
    src: ./tmp/wasteland/wasteland-core-main/txadmin/wasteland_core.png
    dest: ./wasteland_core.png
  # The updater: stop the server, double-click update_wasteland.bat, start it.
  - action: move_path
    src: ./tmp/wasteland/wasteland-core-main/tools/update.ps1
    dest: ./update_wasteland.ps1
  - action: move_path
    src: ./tmp/wasteland/wasteland-core-main/tools/update_wasteland.bat
    dest: ./update_wasteland.bat

  # 4. The database (Wasteland creates its tables itself on the first start)
  - action: connect_database

  # 5. Clean up
  - action: remove_path
    path: ./tmp
